<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 420px;
            font-family: 'Segoe UI', sans-serif;
            padding: 10px;
            margin: 0;
        }
        h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
        }
        #historial {
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            background: #f5f5f5;
            padding: 8px;
            border: 1px solid #ddd;
        }
        .tecla {
            padding: 2px 0;
            border-bottom: 1px solid #eee;
        }
        .key {
            font-weight: bold;
            color: #0067b8;
        }
        .url {
            color: #888;
            font-size: 10px;
        }
        .botones {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }
        button {
            flex: 1;
            padding: 6px 10px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            color: white;
        }
        #btnExportar { background: #2e7d32; }
        #btnExportar:hover { background: #1b5e20; }
        #btnActualizar { background: #0067b8; }
        #btnActualizar:hover { background: #005a9e; }
        #btnLimpiar { background: #d32f2f; }
        #btnLimpiar:hover { background: #b71c1c; }
    </style>
</head>
<body>
    <h3>🔍 Teclas capturadas</h3>
    <div id="historial">Cargando...</div>
    
    <div class="botones">
        <button id="btnExportar">Exportar .txt</button>
        <button id="btnActualizar">Actualizar</button>
        <button id="btnLimpiar">Limpiar</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
